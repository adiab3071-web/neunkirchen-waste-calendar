index.htm<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abfallkalender Neunkirchen</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        select, input, button { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background: #eef9f1; border-left: 4px solid #27ae60; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Abfallkalender Neunkirchen</h2>
    <label for="street">Straße auswählen:</label>
    <select id="street" onchange="showSchedule()">
        <option value="">-- Bitte Straße wählen --</option>
        <option value="hauptstr">Hauptstraße</option>
        <option value="bahnstr">Bahnhofstraße</option>
        <option value="kölnerstr">Kölner Straße</option>
    </select>

    <div id="result" class="result">
        <p><strong>Restmüll:</strong> <span id="rest"></span></p>
        <p><strong>Biomüll:</strong> <span id="bio"></span></p>
        <p><strong>Gelber Sack:</strong> <span id="gelb"></span></p>
    </div>

    <hr style="margin-top: 20px;">
    <h3>E-Mail Benachrichtigung</h3>
    <input type="email" id="email" placeholder="Ihre E-Mail-Adresse">
    <button onclick="subscribe()">Erinnerung aktivieren</button>
</div>l
